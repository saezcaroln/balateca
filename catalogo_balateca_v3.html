<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Repuestos — Balateca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo:    #FABA1E;
    --rojo-d:  #641A9E;
    --negro:   #FFF9E8;
    --gris-d:  #FFFFFF;
    --gris-m:  #F7EEF7;
    --gris-l:  #D299CF;
    --gris-t:  #6D5A75;
    --blanco:  #21162B;
    --acento:  #F14A87;
    --borde:   rgba(100,26,158,0.16);
    --sombra:  0 12px 30px rgba(100,26,158,0.12);
    --radio:   8px;
    --trans:   all 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background:
      radial-gradient(circle at 90% 0%, rgba(210,153,207,0.32), transparent 34%),
      linear-gradient(180deg, #FFF9E8 0%, #FFFFFF 42%, #FFF9E8 100%);
    color: var(--blanco);
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    background: rgba(255,249,232,0.94);
    border-bottom: 3px solid var(--rojo);
    box-shadow: 0 8px 22px rgba(100,26,158,0.12);
    padding: 0 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 2rem;
    height: 64px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
    color: var(--acento);
    text-decoration: none;
    line-height: 1;
  }
  .logo img {
    display: block;
    width: 178px;
    height: auto;
    max-height: 42px;
    object-fit: contain;
  }
  .logo span { color: var(--rojo-d); }
  .header-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gris-t);
    border-left: 1px solid rgba(100,26,158,0.22);
    padding-left: 2rem;
  }
  .header-badge {
    margin-left: auto;
    background: var(--rojo);
    color: var(--rojo-d);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
  }

  /* ── Layout ── */
  .page { display: flex; min-height: calc(100vh - 64px); }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--gris-d);
    border-right: 1px solid var(--borde);
    padding: 1.5rem 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--rojo) transparent;
  }
  .sidebar-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gris-t);
    padding: 0 1.2rem 0.8rem;
    border-bottom: 1px solid var(--borde);
    margin-bottom: 0.5rem;
  }
  .cat-btn {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.7rem 1.2rem;
    text-align: left;
    color: var(--gris-t);
    font-family: 'Barlow', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    transition: var(--trans);
    border-left: 3px solid transparent;
  }
  .cat-btn:hover { background: rgba(250,186,30,0.18); color: var(--blanco); }
  .cat-btn.active { color: var(--blanco); border-left-color: var(--rojo); background: rgba(250,186,30,0.26); }
  .cat-btn .icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.7; }
  .cat-btn.active .icon { opacity: 1; color: var(--rojo-d); }
  .cat-btn .cat-name { flex: 1; line-height: 1.3; }
  .cat-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--gris-m);
    color: var(--gris-t);
    padding: 0.1rem 0.45rem;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .cat-btn.active .cat-count { background: var(--rojo); color: var(--rojo-d); }

  /* ── Main content ── */
  .main { flex: 1; padding: 2rem; overflow: hidden; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .toolbar-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    flex: 1;
    min-width: 200px;
  }
  .toolbar-title span { color: var(--acento); }

  .search-wrap {
    position: relative;
    min-width: 260px;
  }
  .search-wrap svg {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: var(--gris-t);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    background: #fff;
    border: 1px solid var(--gris-l);
    border-radius: var(--radio);
    color: var(--blanco);
    font-family: 'Barlow', sans-serif;
    font-size: 0.875rem;
    padding: 0.55rem 0.75rem 0.55rem 2.25rem;
    outline: none;
    transition: var(--trans);
  }
  #searchInput:focus { border-color: var(--rojo); }
  #searchInput::placeholder { color: var(--gris-t); }

  .filter-select {
    background: #fff;
    border: 1px solid var(--gris-l);
    border-radius: var(--radio);
    color: var(--blanco);
    font-family: 'Barlow', sans-serif;
    font-size: 0.875rem;
    padding: 0.55rem 0.75rem;
    outline: none;
    cursor: pointer;
    transition: var(--trans);
    min-width: 160px;
  }
  .filter-select:focus { border-color: var(--rojo); }
  .filter-select option { background: var(--gris-d); }

  .results-info {
    font-size: 0.8rem;
    color: var(--gris-t);
    white-space: nowrap;
  }
  .results-info strong { color: var(--blanco); }

  /* ── Marca pills ── */
  .marca-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.5rem;
  }
  .marca-pill {
    background: var(--gris-m);
    border: 1px solid var(--gris-l);
    border-radius: 20px;
    padding: 0.25rem 0.75rem;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--trans);
    color: var(--gris-t);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.03em;
  }
  .marca-pill:hover { border-color: var(--rojo); color: var(--blanco); background: rgba(250,186,30,0.16); }
  .marca-pill.active { background: var(--rojo); border-color: var(--rojo); color: var(--rojo-d); }
  .marca-pill.all { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ── Product grid ── */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  .product-card {
    background: var(--gris-d);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: var(--trans);
    position: relative;
    overflow: hidden;
  }
  .product-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: var(--rojo);
    opacity: 0;
    transition: var(--trans);
  }
  .product-card:hover {
    border-color: rgba(250,186,30,0.72);
    transform: translateY(-2px);
    box-shadow: var(--sombra);
  }
  .product-card:hover::before { opacity: 1; }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .card-codigo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--rojo-d);
    text-transform: uppercase;
    background: rgba(250,186,30,0.34);
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    line-height: 1.4;
  }
  .card-tipo {
    font-size: 0.68rem;
    color: var(--gris-t);
    font-weight: 500;
    background: var(--gris-m);
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    white-space: nowrap;
  }

  .card-desc {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--blanco);
    line-height: 1.4;
    flex: 1;
  }
  .card-marca {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--gris-t);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .card-pos {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--rojo-d);
    background: rgba(210,153,207,0.28);
    padding: 0.1rem 0.4rem;
    border-radius: 2px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.25rem;
    padding-top: 0.6rem;
    border-top: 1px solid var(--borde);
  }
  .card-precio {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--blanco);
  }
  .card-precio small {
    font-size: 0.7rem;
    color: var(--gris-t);
    font-weight: 400;
    margin-right: 2px;
  }
  .stock-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .stock-ok  { background: rgba(39,174,96,0.18); color: #2ECC71; }
  .stock-low { background: rgba(243,156,18,0.18); color: #F39C12; }
  .stock-out { background: rgba(241,74,135,0.16); color: #B9135D; }

  .btn-cotizar {
    display: block;
    width: 100%;
    margin-top: 0.5rem;
    background: var(--rojo);
    color: var(--rojo-d);
    border: none;
    border-radius: var(--radio);
    padding: 0.55rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: var(--trans);
  }
  .btn-cotizar:hover { background: var(--rojo-d); color: #fff; }

  /* ── Empty state ── */
  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--gris-t);
  }
  .empty-state svg { width: 48px; height: 48px; margin: 0 auto 1rem; opacity: 0.3; display: block; }
  .empty-state p { font-size: 0.95rem; }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 2rem;
    flex-wrap: wrap;
  }
  .page-btn {
    background: var(--gris-m);
    border: 1px solid var(--gris-l);
    color: var(--gris-t);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.4rem 0.75rem;
    border-radius: var(--radio);
    cursor: pointer;
    transition: var(--trans);
  }
  .page-btn:hover { border-color: var(--rojo); color: var(--blanco); background: rgba(250,186,30,0.16); }
  .page-btn.active { background: var(--rojo); border-color: var(--rojo); color: var(--rojo-d); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .site-header { gap: 1rem; padding: 0 1rem; }
    .logo img { width: 148px; }
    .header-tag { display: none; }
    .sidebar { display: none; }
    .main { padding: 1rem; }
    .product-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search-wrap, .filter-select { min-width: unset; width: 100%; }
  }
  @media (max-width: 480px) {
    .header-badge { font-size: 0.68rem; padding: 0.25rem 0.55rem; }
    .product-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

  </main>
</div>

const PAGE_SIZE = 48;
let state = {
  cat: null,
  marca: null,
  search: '',
  tipo: '',
  page: 1,
};

// ── Helpers ──────────────────────────────────────────────────────────────────
const fmt = n => '$' + n.toLocaleString('es-CL');

function stockBadge(s) {
  if (s >= 5) return `<span class="stock-badge stock-ok">Stock: ${s}</span>`;
  if (s >= 1) return `<span class="stock-badge stock-low">Stock: ${s}</span>`;
  return `<span class="stock-badge stock-out">Sin stock</span>`;
}

function allProducts(cat) {
  if (!cat || !CATALOG[cat]) return [];
  return Object.values(CATALOG[cat]).flat();
}

function filteredProducts() {
  let prods = allProducts(state.cat);
  if (state.marca) prods = prods.filter(p =>
    (CATALOG[state.cat][state.marca] || []).includes(p)
  );
  if (state.search) {
    const q = state.search.toLowerCase();
    prods = prods.filter(p =>
      p.desc.toLowerCase().includes(q) ||
      p.codigo.toLowerCase().includes(q) ||
      (p.pos && p.pos.toLowerCase().includes(q))
    );
  }
  if (state.tipo) prods = prods.filter(p => p.tipo.includes(state.tipo));
  return prods;
}

line x1=\"16\" y1=\"10\" x2=\"16\" y2=\"16\"/></svg>", "Patines de freno embalatados": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"8\" width=\"18\" height=\"10\" rx=\"1\"/><path d=\"M3 11h18\"/><path d=\"M12 8V4\"/><path d=\"M8 4h8\"/></svg>"};

function buildSidebar() {
  const menu = document.getElementById('catMenu');
  menu.innerHTML = '';
  Object.entries(CATALOG).forEach(([cat, marcas]) => {
    const total = Object.values(marcas).flat().length;
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (state.cat === cat ? ' active' : '');
    btn.innerHTML = `
      <span class="icon">${ICONS[cat] || ''}</span>
      <span class="cat-name">${cat}</span>
      <span class="cat-count">${total}</span>`;
    btn.addEventListener('click', () => {
      state.cat = cat; state.marca = null; state.page = 1; state.search = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('tipoFilter').value = '';
      state.tipo = '';
      render();
    });
    menu.appendChild(btn);
  });
}

// ── Build marca pills ────────────────────────────────────────────────────────
function buildMarcaPills() {
  const wrap = document.getElementById('marcaPills');
  wrap.innerHTML = '';
  if (!state.cat) return;
  const marcas = Object.keys(CATALOG[state.cat]);

  const all = document.createElement('button');
  all.className = 'marca-pill all' + (!state.marca ? ' active' : '');
  all.textContent = 'Todas';
  all.addEventListener('click', () => { state.marca = null; state.page = 1; render(); });
  wrap.appendChild(all);

  marcas.forEach(m => {
    if (!m || m === '') return;
    const btn = document.createElement('button');
    btn.className = 'marca-pill' + (state.marca === m ? ' active' : '');
    btn.textContent = m;
    btn.addEventListener('click', () => {
      state.marca = state.marca === m ? null : m;
      state.page = 1; render();
    });
    wrap.appendChild(btn);
  });
}

// ── Build product grid ───────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('productGrid');
  const prods = filteredProducts();
  const start = (state.page - 1) * PAGE_SIZE;
  const page_prods = prods.slice(start, start + PAGE_SIZE);

  document.getElementById('resultsInfo').innerHTML =
    prods.length > 0
      ? `Mostrando <strong>${page_prods.length}</strong> de <strong>${prods.length}</strong>`
      : '';

  if (!state.cat) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/>
          <line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/>
        </svg>
        <p>Selecciona una categoría en el menú izquierdo para ver los productos disponibles.</p>
      </div>`;
    return;
  }

  if (page_prods.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>No se encontraron productos con los filtros actuales.</p>
      </div>`;
    return;
  }

  grid.innerHTML = page_prods.map(p => {
    const whatsapp = `https://wa.me/56912345678?text=${encodeURIComponent('Hola Balateca, necesito cotizar el producto Código: ' + p.codigo + ' – ' + p.desc)}`;
    return `
    <div class="product-card">
      <div class="card-header">
        <span class="card-codigo">${p.codigo}</span>
        <span class="card-tipo">${p.tipo}</span>
      </div>
      <div class="card-desc">${p.desc}</div>
      <div>
        <span class="card-marca">${p.marca || ''}</span>
        ${p.pos ? `<span class="card-pos">${p.pos}</span>` : ''}
      </div>
      <div class="card-footer">
        <div class="card-precio"><small>CLP</small>${fmt(p.precio)}</div>
        ${stockBadge(p.stock)}
      </div>
      <a class="btn-cotizar" href="${whatsapp}" target="_blank">Cotizar por WhatsApp</a>
    </div>`;
  }).join('');
}

// ── Pagination ───────────────────────────────────────────────────────────────
function buildPagination() {
  const wrap = document.getElementById('pagination');
  const prods = filteredProducts();
  const total = Math.ceil(prods.length / PAGE_SIZE);
  wrap.innerHTML = '';
  if (total <= 1) return;

  const prev = document.createElement('button');
  prev.className = 'page-btn'; prev.textContent = '←';
  prev.disabled = state.page === 1;
  prev.addEventListener('click', () => { state.page--; render(); window.scrollTo(0,0); });
  wrap.appendChild(prev);

  const range = [];
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || (i >= state.page - 2 && i <= state.page + 2)) range.push(i);
    else if (range[range.length-1] !== '...') range.push('...');
  }

  range.forEach(i => {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === state.page ? ' active' : '');
    btn.textContent = i;
    if (i === '...') { btn.disabled = true; btn.style.border='none'; }
    else btn.addEventListener('click', () => { state.page = i; render(); window.scrollTo(0,0); });
    wrap.appendChild(btn);
  });

  const next = document.createElement('button');
  next.className = 'page-btn'; next.textContent = '→';
  next.disabled = state.page === total;
  next.addEventListener('click', () => { state.page++; render(); window.scrollTo(0,0); });
  wrap.appendChild(next);
}

// ── Title ────────────────────────────────────────────────────────────────────
function buildTitle() {
  const t = document.getElementById('pageTitle');
  if (!state.cat) { t.innerHTML = 'Selecciona una <span>categoría</span>'; return; }
  const marca = state.marca ? ` · <span>${state.marca}</span>` : '';
  t.innerHTML = `${state.cat}${marca}`;
}

// ── Master render ────────────────────────────────────────────────────────────
function render() {
  buildSidebar();
  buildMarcaPills();
  buildTitle();
  buildGrid();
  buildPagination();
}

// ── Search & filter events ───────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  state.page = 1;
  render();
});
document.getElementById('tipoFilter').addEventListener('change', e => {
  state.tipo = e.target.value;
  state.page = 1;
  render();
});

// ── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
